 ĐỔI CHẤT VÀ CHUYỂN HÓA NĂNG LƯỢNG Ở SINH VẬT", "part": "PHẦN 2. TRẮC NGHIỆM ĐÚNG / SAI", "prompt": "Câu 4. Sinh vật tự dưỡng:", "statement": "b. Cung cấp nơi ở, nơi sinh sản cho động vật.", "answer": "Đ", "explain": ""}, {"id": 30, "type": "tf", "section": "BÀI 1. TRAO ĐỔI CHẤT VÀ CHUYỂN HÓA NĂNG LƯỢNG Ở SINH VẬT", "part": "PHẦN 2. TRẮC NGHIỆM ĐÚNG / SAI", "prompt": "Câu 4. Sinh vật tự dưỡng:", "statement": "c. Phân giải chất thải, xác của sinh vật khác.", "answer": "S", "explain": "sinh vật phân giải"}, {"id": 31, "type": "tf", "section": "BÀI 1. TRAO ĐỔI CHẤT VÀ CHUYỂN HÓA NĂNG LƯỢNG Ở SINH VẬT", "part": "PHẦN 2. TRẮC NGHIỆM ĐÚNG / SAI", "prompt": "Câu 4. Sinh vật tự dưỡng:", "statement": "d. Cung cấp vật chất và năng lượng cho sinh giới.", "answer": "Đ", "explain": ""}, {"id": 32, "type": "tf", "section": "BÀI 1. TRAO ĐỔI CHẤT VÀ CHUYỂN HÓA NĂNG LƯỢNG Ở SINH VẬT", "part": "PHẦN 2. TRẮC NGHIỆM ĐÚNG / SAI", "prompt": "Câu 5. Sinh vật tự dưỡng và dị dưỡng:", "statement": "a. Bò là sinh vật dị dưỡng loại phân giải.", "answer": "S", "explain": "bò thuộc loại tiêu thụ"}, {"id": 33, "type": "tf", "section": "BÀI 1. TRAO ĐỔI CHẤT VÀ CHUYỂN HÓA NĂNG LƯỢNG Ở SINH VẬT", "part": "PHẦN 2. TRẮC NGHIỆM ĐÚNG / SAI", "prompt": "Câu 5. Sinh vật tự dưỡng và dị dưỡng:", "statement": "b. Sinh vật tự dưỡng gồm vi khuẩn cộng sinh trong ruột mối, tảo, thực vật.", "answer": "S", "explain": "vi khuẩn ruột mối là dị dưỡng"}, {"id": 34, "type": "tf", "section": "BÀI 1. TRAO ĐỔI CHẤT VÀ CHUYỂN HÓA NĂNG LƯỢNG Ở SINH VẬT", "part": "PHẦN 2. TRẮC NGHIỆM ĐÚNG / SAI", "prompt": "Câu 5. Sinh vật tự dưỡng và dị dưỡng:", "statement": "c. Nấm là sinh vật dị dưỡng loại tiêu thụ.", "answer": "S", "explain": "nấm thuộc loại phân giải"}, {"id": 35, "type": "tf", "section": "BÀI 1. TRAO ĐỔI CHẤT VÀ CHUYỂN HÓA NĂNG LƯỢNG Ở SINH VẬT", "part": "PHẦN 2. TRẮC NGHIỆM ĐÚNG / SAI", "prompt": "Câu 5. Sinh vật tự dưỡng và dị dưỡng:", "statement": "d. Sinh vật dị dưỡng tích lũy năng lượng nhờ hóa tổng hợp.", "answer": "S", "explain": "hóa tổng hợp thuộc nhóm tự dưỡng"}, {"id": 36, "type": "short", "section": "BÀI 1. TRAO ĐỔI CHẤT VÀ CHUYỂN HÓA NĂNG LƯỢNG Ở SINH VẬT", "part": "PHẦN 3. TRẢ LỜI NGẮN", "prompt": "Câu 1. Quá trình chuyển hóa năng lượng trong sinh giới trải qua mấy giai đoạn?", "answer": "3 giai đoạn: tổng hợp, phân giải, huy động năng lượng.", "explain": ""}, {"id": 37, "type": "short", "section": "BÀI 1. TRAO ĐỔI CHẤT VÀ CHUYỂN HÓA NĂNG LƯỢNG Ở SINH VẬT", "part": "PHẦN 3. TRẢ LỜI NGẮN", "prompt": "Câu 2. Trong các dạng ADP, ATP, mỡ và glycogen, có bao nhiêu dạng năng lượng tích lũy dễ sử dụng khi cơ thể lấy O2, nước và thức ăn từ môi trường?", "answer": "1 dạng dễ sử dụng ngay là ATP. Mỡ và glycogen là dạng dự trữ; ADP không phải dạng tích lũy năng lượng.", "explain": ""}, {"id": 38, "type": "short", "section": "BÀI 1. TRAO ĐỔI CHẤT VÀ CHUYỂN HÓA NĂNG LƯỢNG Ở SINH VẬT", "part": "PHẦN 3. TRẢ LỜI NGẮN", "prompt": "Câu 3. Trong các chất O2, H2O, CO2, thức ăn và chất khoáng, có bao nhiêu chất thiết yếu của cả động vật và thực vật?", "answer": "3 chất: O2, H2O và chất khoáng. (Thức ăn chủ yếu với động vật; CO2 là nguồn carbon chủ yếu của thực vật.)", "explain": ""}, {"id": 39, "type": "short", "section": "BÀI 1. TRAO ĐỔI CHẤT VÀ CHUYỂN HÓA NĂNG LƯỢNG Ở SINH VẬT", "part": "PHẦN 3. TRẢ LỜI NGẮN", "prompt": "Câu 4. Trong các chất O2, CO2, nước tiểu và phân, có bao nhiêu chất là chất thải ở cả động vật và thực vật?", "answer": "1 chất: CO2 (sản phẩm hô hấp của cả hai). O2 là chất thải của quang hợp ở thực vật, không phải của động vật. Phân và nước tiểu là chất thải của động vật.", "explain": ""}, {"id": 40, "type": "mcq", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 1. Có bao nhiêu phát biểu đúng về vai trò của nước?\n(1) Là thành phần cấu tạo của tế bào.\n(2) Là dung môi hòa tan các chất, tham gia quá trình vận chuyển vật chất trong cây.\n(3) Là nguyên liệu, môi trường của các phản ứng sinh hóa.\n(4) Điều hòa nhiệt độ của cơ thể thực vật.", "choices": [{"label": "A", "text": "1."}, {"label": "B", "text": "2."}, {"label": "C", "text": "3."}, {"label": "D", "text": "4."}], "answer": "D", "explain": ""}, {"id": 41, "type": "mcq", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 2. Thực vật trên cạn, nước và khoáng từ đất được hấp thụ chủ yếu nhờ:", "choices": [{"label": "A", "text": "Tế bào biểu bì của toàn bộ cây."}, {"label": "B", "text": "Tế bào mạch gỗ ở rễ."}, {"label": "C", "text": "Tế bào lông hút ở rễ."}, {"label": "D", "text": "Lông hút ở rễ."}], "answer": "D", "explain": ""}, {"id": 42, "type": "mcq", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 3. Thực vật thủy sinh, nước và khoáng được hấp thụ nhờ:", "choices": [{"label": "A", "text": "Tế bào biểu bì của toàn bộ cây."}, {"label": "B", "text": "Mạch gỗ ở rễ."}, {"label": "C", "text": "Lông hút ở lá."}, {"label": "D", "text": "Lông hút ở rễ."}], "answer": "A", "explain": ""}, {"id": 43, "type": "mcq", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 4. Lông hút được hình thành từ:", "choices": [{"label": "A", "text": "Tế bào nội bì."}, {"label": "B", "text": "Tế bào biểu bì thân."}, {"label": "C", "text": "Tế bào biểu bì rễ."}, {"label": "D", "text": "Mạch rây của rễ."}], "answer": "C", "explain": ""}, {"id": 44, "type": "mcq", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 5. Một số loài cây gỗ lớn (thông, sồi) rễ không có lông hút nhưng vẫn lấy được nước và khoáng nhờ:", "choices": [{"label": "A", "text": "Hấp thụ trực tiếp qua biểu bì của rễ."}, {"label": "B", "text": "Hình thành rễ phụ để thực hiện chức năng này."}, {"label": "C", "text": "Chủ yếu nhờ thụ nước qua lá."}, {"label": "D", "text": "Cộng sinh với nấm hình thành nấm rễ."}], "answer": "D", "explain": ""}, {"id": 45, "type": "mcq", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 6. Rễ cây hấp thụ nước từ đất theo cơ chế:", "choices": [{"label": "A", "text": "Nhập bào."}, {"label": "B", "text": "Chủ động."}, {"label": "C", "text": "Thẩm tách."}, {"label": "D", "text": "Thẩm thấu."}], "answer": "D", "explain": ""}, {"id": 46, "type": "mcq", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 7. Nguyên nhân nào làm dịch tế bào lông hút có áp suất thẩm thấu cao?\n(1) Rễ hấp thụ ion khoáng từ đất và tích lũy chất tan từ chuyển hóa vật chất.\n(2) Thoát hơi nước ở lá làm giảm lượng nước ở tế bào lông hút.\n(3) Rễ hấp thụ nước và tích lũy nước.\n(4) Rễ tiết chất làm phân giải chất tan trong dung dịch đất.", "choices": [{"label": "A", "text": "1, 2."}, {"label": "B", "text": "1, 3."}, {"label": "C", "text": "1, 4."}, {"label": "D", "text": "2, 3."}], "answer": "A", "explain": "Ý (1) là nguyên nhân chính. Ý (3) và (4) không làm tăng áp suất thẩm thấu."}, {"id": 47, "type": "mcq", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 8. Thực vật ở cạn có thể chết khi bị ngập úng vì:\n(1) Rễ thiếu oxygen nên không hô hấp được.\n(2) Cây hút nước quá nhiều, mất cân bằng nước.\n(3) Hô hấp rễ bị đình trệ, cây thiếu năng lượng.\n(4) Lông hút bị chết hoặc tiêu biến nhiều.", "choices": [{"label": "A", "text": "1, 2."}, {"label": "B", "text": "1, 2, 4."}, {"label": "C", "text": "1, 3, 4."}, {"label": "D", "text": "2, 3, 4."}], "answer": "C", "explain": ""}, {"id": 48, "type": "short", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 9. Thả bèo trước khi cấy lúa giúp lúa phát triển nhanh hơn gieo thẳng. Nguyên nhân sinh học đúng nhất là bèo hoa dâu có vi khuẩn lam cố định đạm, làm giàu nitơ cho đất. Trong các ý liệt kê trên đề, ý đúng về lợi ích canh tác là tận dụng đất và bố trí thời vụ; ý sinh học cần nhớ:", "answer": "Bèo hoa dâu cộng sinh với vi khuẩn lam (Anabaena) cố định N2, cung cấp đạm cho lúa.", "explain": ""}, {"id": 49, "type": "mcq", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 10. Đất nhiễm mặn, cây không sống được vì:", "choices": [{"label": "A", "text": "Hàm lượng nước trong đất là quá thấp."}, {"label": "B", "text": "Thế năng của nước trong đất quá thấp."}, {"label": "C", "text": "Hàm lượng oxygen trong đất thấp do lông hút bị chết."}, {"label": "D", "text": "Ion Na+ và Cl- cao gây đầu độc tế bào."}], "answer": "B", "explain": "Đất mặn làm thế nước của đất thấp hơn dịch bào rễ nên rễ không hút được nước. Ý D cũng góp phần gây độc, nhưng nguyên nhân trực tiếp theo cơ chế hút nước là thế nước quá thấp."}, {"id": 50, "type": "mcq", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 11. Ở miền Bắc, mạ xuân thường chết rét khi nhiệt độ hạ xuống thấp vì:", "choices": [{"label": "A", "text": "Nhiệt độ thấp làm mạ tăng sinh chống rét, nguồn dinh dưỡng bị cạn kiệt."}, {"label": "B", "text": "Nhiệt độ thấp làm tổn thương rễ, cây không hấp thụ được nước, cây héo chết."}, {"label": "C", "text": "Nhiệt độ thấp làm hệ sinh vật gây hại phát triển, làm cây chết."}, {"label": "D", "text": "Nhiệt độ thấp làm cây không quang hợp được nên chết."}], "answer": "B", "explain": ""}, {"id": 51, "type": "tf", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 12. Về sức hút nước khi trời lạnh:", "statement": "Trời lạnh, sức hút nước của cây giảm.", "answer": "Đ", "explain": ""}, {"id": 52, "type": "tf", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 12. Về sức hút nước khi trời lạnh:", "state xt": "1, 2."}, {"label": "B", "text": "2, 3."}, {"label": "C", "text": "3, 4."}, {"label": "D", "text": "1, 4."}], "answer": "B", "explain": ""}, {"id": 70, "type": "mcq", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 26. Hiện tượng rỉ nhựa (giọt nhựa) khi cắt thân là do:", "choices": [{"label": "A", "text": "Nhựa từ rễ đẩy lên mạch gỗ của rễ (áp suất rễ)."}, {"label": "B", "text": "Nước từ khoảng gian bào tràn ra."}, {"label": "C", "text": "Nước được rễ đẩy lên thân trên bị tràn ra."}, {"label": "D", "text": "Nhựa rỉ ra từ các tế bào bị dập nát."}], "answer": "A", "explain": ""}, {"id": 71, "type": "mcq", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 27. Tiêm màu đỏ vào mạch rây và màu vàng vào mạch gỗ ở cùng độ cao. Hiện tượng đúng là:", "choices": [{"label": "A", "text": "Ngọn chỉ có màu đỏ, chóp rễ chỉ có màu vàng."}, {"label": "B", "text": "Ngọn chỉ có màu vàng (mạch gỗ đi lên); chóp rễ chỉ có màu đỏ (mạch rây đi xuống)."}, {"label": "C", "text": "Ngọn có cả hai màu; chóp rễ chỉ có màu đỏ."}, {"label": "D", "text": "Ngọn chỉ có màu đỏ; chóp rễ có cả hai màu."}], "answer": "B", "explain": ""}, {"id": 72, "type": "mcq", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 28. Sự trương nước hay mất nước của tế bào khí khổng chủ yếu phụ thuộc vào:", "choices": [{"label": "A", "text": "Ánh sáng, nhiệt độ."}, {"label": "B", "text": "Nhiệt độ, lượng nước."}, {"label": "C", "text": "Ánh sáng, stress nước, lượng ion K+ trong tế bào khí khổng."}, {"label": "D", "text": "Ánh sáng, pH."}], "answer": "C", "explain": ""}, {"id": 73, "type": "short", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 29. Thí nghiệm nào không chứng minh được thoát hơi nước ở thực vật? (4 chậu trong hình)", "answer": "Thí nghiệm 2. Chậu bị bịt kín hoặc không tách được lượng nước thoát hơi với các con đường mất nước khác thì không chứng minh đúng thoát hơi nước qua lá. Trên đề khoanh D. 2.", "explain": ""}, {"id": 74, "type": "mcq", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 30. Cây nào không bị héo? (lượng nước hút vào / thoát ra)\nCây (1): hút 25 g, thoát 27 g.   Cây (2): hút 31 g, thoát 29 g.\nCây (3): hút 32 g, thoát 34 g.   Cây (4): hút 36 g, thoát 33 g.", "choices": [{"label": "A", "text": "Cây (2) và cây (4)."}, {"label": "B", "text": "Cây (3) và cây (4)."}, {"label": "C", "text": "Cây (1) và cây (3)."}, {"label": "D", "text": "Cây (1) và cây (2)."}], "answer": "A", "explain": "Cây héo khi nước thoát ra lớn hơn nước hút vào. Cây 2 và 4 hút nhiều hơn thoát."}, {"id": 75, "type": "mcq", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 31. Nguyên tố dinh dưỡng khoáng thiết yếu là nguyên tố:", "choices": [{"label": "A", "text": "Thiếu nó cây không hoàn thành được chu trình sống."}, {"label": "B", "text": "Có thể thay thế bởi một nguyên tố khác khi cây cần."}, {"label": "C", "text": "Chỉ tham gia gián tiếp vào chuyển hóa vật chất."}, {"label": "D", "text": "Chiếm hàm lượng lớn hơn các nguyên tố khác trong cơ thể."}], "answer": "A", "explain": ""}, {"id": 76, "type": "mcq", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 32. Nhóm nguyên tố vi lượng là:", "choices": [{"label": "A", "text": "C, H, O, K."}, {"label": "B", "text": "Fe, Cu, Zn, Cl."}, {"label": "C", "text": "P, Mg, S, N."}, {"label": "D", "text": "P, K, N, Ca."}], "answer": "B", "explain": ""}, {"id": 77, "type": "mcq", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 33. Cách nhận biết rõ nhất thời điểm cây thiếu nguyên tố khoáng và cần bón phân là căn cứ vào:", "choices": [{"label": "A", "text": "Biểu hiện của quả non."}, {"label": "B", "text": "Biểu hiện của màu sắc hoa."}, {"label": "C", "text": "Biểu hiện của thân cây."}, {"label": "D", "text": "Biểu hiện của lá cây."}], "answer": "D", "explain": ""}, {"id": 78, "type": "mcq", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 34. Lá vàng do thiếu diệp lục, cần bón nhóm nguyên tố nào?", "choices": [{"label": "A", "text": "N, P, S."}, {"label": "B", "text": "N, K, S."}, {"label": "C", "text": "N, K, Mg."}, {"label": "D", "text": "N, Mg, Fe."}], "answer": "D", "explain": ""}, {"id": 79, "type": "mcq", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 35. Thiếu sắt (Fe) thì lá vàng vì sắt:", "choices": [{"label": "A", "text": "Là thành phần cấu tạo diệp lục."}, {"label": "B", "text": "Là cofactor enzyme xúc tác tổng hợp diệp lục."}, {"label": "C", "text": "Là thành phần cấu tạo lục lạp."}, {"label": "D", "text": "Xúc tác cho quang hợp trực tiếp."}], "answer": "B", "explain": ""}, {"id": 80, "type": "mcq", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 36. “Lá nhỏ, mềm, chồi đỉnh bị chết” là dấu hiệu thiếu nguyên tố:", "choices": [{"label": "A", "text": "Cl."}, {"label": "B", "text": "P."}, {"label": "C", "text": "Mg."}, {"label": "D", "text": "Ca."}], "answer": "D", "explain": ""}, {"id": 81, "type": "mcq", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 37. Nguyên tố vi lượng chỉ cần lượng rất nhỏ nhưng thiếu thì cây còi cọc, có thể chết. Vai trò chủ yếu là:", "choices": [{"label": "A", "text": "Tham gia cấu trúc nên tế bào."}, {"label": "B", "text": "Hoạt hóa enzyme trong trao đổi chất."}, {"label": "C", "text": "Quy định áp suất thẩm thấu của dịch tế bào."}, {"label": "D", "text": "Thúc đẩy , "explain": ""}, {"id": 114, "type": "tf", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 2. CÂU HỎI ĐÚNG / SAI", "prompt": "Câu 5. Hiện tượng ứ giọt chủ yếu ở cây bụi, cây thân thảo:", "statement": "d. Cây bụi và thân thảo không có mạch gỗ.", "answer": "S", "explain": ""}, {"id": 115, "type": "tf", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 2. CÂU HỎI ĐÚNG / SAI", "prompt": "Câu 6. Thí nghiệm 4 lá, bôi mỡ, cân sau 24 giờ:", "statement": "a. Bước bôi mỡ là bước thu thập số liệu.", "answer": "S", "explain": "đó là bước tạo phép thử; cân lá mới là thu số liệu"}, {"id": 116, "type": "tf", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 2. CÂU HỎI ĐÚNG / SAI", "prompt": "Câu 6. Thí nghiệm 4 lá, bôi mỡ, cân sau 24 giờ:", "statement": "b. Thí nghiệm nhằm so sánh thoát hơi nước ở hai mặt lá.", "answer": "Đ", "explain": ""}, {"id": 117, "type": "tf", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 2. CÂU HỎI ĐÚNG / SAI", "prompt": "Câu 6. Thí nghiệm 4 lá, bôi mỡ, cân sau 24 giờ:", "statement": "c. Khí khổng phân bố chủ yếu ở mặt dưới lá.", "answer": "Đ", "explain": "bôi mặt dưới thì cây mất ít nước hơn"}, {"id": 118, "type": "tf", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 2. CÂU HỎI ĐÚNG / SAI", "prompt": "Câu 6. Thí nghiệm 4 lá, bôi mỡ, cân sau 24 giờ:", "statement": "d. X = 2,01 − 1,97 = 0,04 g.", "answer": "Đ", "explain": ""}, {"id": 119, "type": "tf", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 2. CÂU HỎI ĐÚNG / SAI", "prompt": "Câu 7. Bảng bón phân cho mía:", "statement": "a. Trước khi trồng nên bón thúc.", "answer": "S", "explain": "phải bón lót"}, {"id": 120, "type": "tf", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 2. CÂU HỎI ĐÚNG / SAI", "prompt": "Câu 7. Bảng bón phân cho mía:", "statement": "b. Bón lót phân hữu cơ khi mía đang đẻ nhánh.", "answer": "S", "explain": ""}, {"id": 121, "type": "tf", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 2. CÂU HỎI ĐÚNG / SAI", "prompt": "Câu 7. Bảng bón phân cho mía:", "statement": "c. Nguyên tắc bón lót là trộn đều phân vào đất.", "answer": "Đ", "explain": ""}, {"id": 122, "type": "tf", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 2. CÂU HỎI ĐÚNG / SAI", "prompt": "Câu 7. Bảng bón phân cho mía:", "statement": "d. Không bón lân ở lần thúc đẻ nhánh và tạo lóng (lân chủ yếu bón lót).", "answer": "Đ", "explain": ""}, {"id": 123, "type": "short", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 3. TỰ LUẬN (gợi ý trả lời ngắn)", "prompt": "Câu 1. Nước đi từ đất vào cây theo những con đường nào? Đặc điểm lợi và bất lợi?", "answer": "Hai con đường: gian bào (apoplast) và tế bào chất (symplast). Gian bào đi nhanh, không qua chất nguyên sinh, bị đai Caspari chặn ở nội bì. Tế bào chất đi chậm hơn, có tính chọn lọc. Muốn chứng minh con đường gian bào có thể dùng thuốc nhuộm không qua màng sinh chất: chất màu dừng lại ở nội bì.", "explain": ""}, {"id": 124, "type": "short", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 3. TỰ LUẬN (gợi ý trả lời ngắn)", "prompt": "Câu 2. Cấu tạo mạch gỗ thích nghi với việc vận chuyển nước và ion khoáng. Câu nói “thoát hơi nước là một tai họa tất yếu” nghĩa là gì? Các con đường thoát hơi nước?", "answer": "Mạch gỗ gồm tế bào chết, rỗng, hóa gỗ, xếp thành ống liên tục nên cột nước đi lên ít cản trở. Thoát hơi nước làm cây mất nước nhưng là tai họa tất yếu vì khí khổng phải mở để lấy CO2 cho quang hợp, đồng thời tạo lực hút dòng nước và khoáng. Nước thoát chủ yếu qua khí khổng, một phần qua cutin.", "explain": ""}, {"id": 125, "type": "short", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 3. TỰ LUẬN (gợi ý trả lời ngắn)", "prompt": "Câu 3. Phân biệt các con đường thoát hơi nước.", "answer": "Qua khí khổng: chủ yếu, có thể điều chỉnh bằng đóng mở khí khổng. Qua cutin: ít hơn, phụ thuộc độ dày cutin, cây non thoát nhiều hơn cây già.", "explain": ""}, {"id": 126, "type": "short", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 3. TỰ LUẬN (gợi ý trả lời ngắn)", "prompt": "Câu 4. Cây sống trong môi trường khô nóng hoặc đất mặn, đất phèn thích nghi thế nào?", "answer": "Khô nóng: lá nhỏ hoặc biến thành gai, cutin dày, khí khổng lõm, mô dự trữ nước, rễ ăn sâu hoặc lan rộng. Đất mặn: tuyến tiết muối, không bào nồng độ cao, mô thông khí, rễ hô hấp (như cây Đước). Đất phèn: chịu được pH thấp và ion độc, thường có mô thông khí nếu đất ngập.", "explain": ""}, {"id": 127, "type": "short", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 3. TỰ LUẬN (gợi ý trả lời ngắn)", "prompt": "Câu 6. Một số cây rụng lá vào mùa đông. Chất dự trữ ở cơ quan phía trên được vận chuyển thế nào?", "answer": "Trước khi rụng lá, chất hữu cơ (đường, amino acid) được chuyển theo mạch rây từ lá xuống thân, rễ để dự trữ. Dòng mạch rây đi từ nơi có áp suất thẩm thấu cao (lá) tới nơi thấp hơn (cơ quan dự trữ).", "explain": ""}, {"id": 128, "type": "short", "section": "BÀI 2. TRAO ĐỔI NƯỚC VÀ KHOÁNG Ở THỰC VẬT", "part": "PHẦN 3. TỰ LUẬN (gợi ý trả lời ngắn)", "prompt": "Câu 7. Vì sao bón lót thường dùng phân hữu cơ, còn đạm và kali dùng để bón thúc?", "answer": "Phân hữu cơ phân giải chậm, cải tạo đất, cung cấp chất kéo dài nên bón lót, trộn vào đất trước khi trồng. Đạm và kali cây cần nhiều ở từng giai đoạn sinh trưởng (đẻ nhánh, tạo lóng, nuôi quả), dễ tan, tác dụng nhanh nên bón thúc theo từng đợt.", "explain": ""}, {"id": 129, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 1. Quang hợp ở thực vật là quá trình:", "choices": [{"label": "A", "text": "Lục lạp hấp thụ và sử dụng năng lượng hóa học để tổng hợp chất hữu cơ từ chất vô cơ."}, {"label": "B", "text": "Tế bào hấp thụ và sử dụng năng lượng ánh sáng để tổng hợp chất hữu cơ từ chất vô cơ."}, {"label": "C", "text": "Lục lạp hấp thụ và sử dụng năng lượng ánh sáng để tổng hợp chất hữu cơ từ chất hữu cơ."}, {"label": "D", "text": "Lục lạp hấp thụ và sử dụng năng lượng ánh sáng để phân giải chất hữu cơ."}], "answer": "B", "explain": ""}, {"id": 130, "type": "short", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 2. Hoàn thành phương trình tổng quát của quang hợp:", "answer": "6CO2 + 6H2O  →  (ánh sáng, diệp lục)  →  C6H12O6 + 6O2", "explain": ""}, {"id": 131, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 3. Năng lượng tích lũy trong chất hữu cơ sau quang hợp có nguồn gốc từ:", "choices": [{"label": "A", "text": "CO2."}, {"label": "B", "text": "H2O."}, {"label": "C", "text": "Diệp lục."}, {"label": "D", "text": "Ánh sáng."}], "answer": "D", "explain": ""}, {"id": 132, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 4. Hệ sắc tố quang hợp gồm chủ yếu:", "choices": [{"label": "A", "text": "Xoang thylakoid."}, {"label": "B", "text": "Diệp lục."}, {"label": "C", "text": "Chất nền lục lạp."}, {"label": "D", "text": "Màng trong lục lạp."}], "answer": "B", "explain": ""}, {"id": 133, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 5. Hệ sắc tố quang hợp có vai trò:", "choices": [{"label": "A", "text": "Hấp thụ và chuyển hóa năng lượng ánh sáng."}, {"label": "B", "text": "Hấp thụ và phân giải năng lượng ánh sáng."}, {"label": "C", "text": "Hấp thụ và tổng hợp năng lượng ATP."}, {"label": "D", "text": "Phân giải năng lượng ánh sáng để tạo ATP."}], "answer": "A", "explain": ""}, {"id": 134, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 6. Sắc tố trực tiếp chuyển quang năng thành hóa năng trong ATP và NADPH là:", "choices": [{"label": "A", "text": "Chlorophyll b."}, {"label": "B", "text": "Chlorophyll a ở trung tâm phản ứng."}, {"label": "C", "text": "Carotenoid."}, {"label": "D", "text": "Xanthophyll."}], "answer": "B", "explain": ""}, {"id": 135, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 7. Rau củ có màu đỏ, cam chứa nhiều sắc tố:", "choices": [{"label": "A", "text": "Carotenoid."}, {"label": "B", "text": "Cytokinin."}, {"label": "C", "text": "Diệp lục."}, {"label": "D", "text": "Phicobilin."}], "answer": "A", "explain": ""}, {"id": 136, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 8. Sắc tố truyền năng lượng ánh sáng theo sơ đồ:", "choices": [{"label": "A", "text": "Carotenoid → diệp lục b → diệp lục a → diệp lục a trung tâm phản ứng."}, {"label": "B", "text": "Carotenoid → diệp lục a → diệp lục b → diệp lục b trung tâm phản ứng."}, {"label": "C", "text": "Diệp lục b → carotenoid → diệp lục a → diệp lục a trung tâm phản ứng."}, {"label": "D", "text": "Diệp lục a → diệp lục b → carotenoid → carotenoid trung tâm phản ứng."}], "answer": "A", "explain": ""}, {"id": 137, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 9. Đối với cơ thể thực vật, quang hợp có vai trò nào?\n(1) Cung cấp chất hữu cơ xây dựng tế bào và cơ thể.\n(2) Cung cấp nguyên liệu cho công nghiệp, xây dựng, dược liệu.\n(3) Cân bằng O2/CO2 khí quyển, giảm hiệu ứng nhà kính.\n(4) Cung cấp và dự trữ năng lượng cho tế bào, cơ thể.", "choices": [{"label": "A", "text": "1, 2."}, {"label": "B", "text": "1, 4."}, {"label": "C", "text": "2, 4."}, {"label": "D", "text": "2, 3."}], "answer": "B", "explain": "Ý (2) và (3) là vai trò đối với sinh giới và con người, không phải vai trò trực tiếp cho bản thân cây."}, {"id": 138, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 10. Đối với sinh giới nói chung, quang hợp có vai trò:\n(1) Cung cấp chất hữu cơ.  (2) Nguyên liệu công nghiệp.  (3) Cân bằng O2/CO2.  (4) Cung cấp O2 và năng lượng cho hầu hết sinh vật.", "choices": [{"label": "A", "text": "1, 2, 3."}, {"label": "B", "text": "1, 2, 4."}, {"label": "C", "text": "1, 3, 4."}, {"label": "D", "text": "2, 3, 4."}], "answer": "C", "explain": ""}, {"id": 139, "type": "short", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 11. Về sơ đồ quang hợp (CO2, H2O đi vào; chất hữu cơ và O2 đi ra), phát biểu đúng là ý nói năng lượng trong glucose có nguồn gốc từ ánh sáng. O2 thoát ra có nguồn gốc từ H2O, không phải từ thoát hơi nước. CO2 lấy qua khí khổng của lá, không phải từ rễ.", "answer": "Chỉ ý “năng lượng tích lũy trong glucose có nguồn gốc từ ánh sáng” chắc chắn đúng. Hai ý nói O2 lấy từ thoát hơi nước và CO2 lấy từ rễ là sai.", "explain": ""}, {"id": 140, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 12. Lá trong ống nghiệm có nước, úp chuông, để ngoài sáng thì bọt khí nổi lên là:", "choices": [{"label": "A", "text": "Oxygen (O2) do quang hợp tạo ra."}, {"label": "B", "text": "Khí nitơ (N2) trong khoang chứa khí của lá bay ra."}, {"label": "C", "text": "CO2 trong quang hợp."}, {"label": "D", "text": "O2 do hô hấp tạo ra."}], "answer": "A", "explain": ""}, {"id": 141, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 13. Phổ hấp thụ của sắc tố quang hợp:\n1. Diệp lục hấp thụ mạnh vùng xanh tím (400–500 nm) và đỏ (khoảng 600–700 nm).\n2. Carotenoid hấp thụ chủ yếu ở vùng xanh tím.\n3. Diệp lục và carotenoid hầu như không hấp thụ vùng xanh lục (500–600 nm).\n4. Ở vùng xanh tím, diệp lục luôn hấp thụ mạnh hơn carotenoid.", "choices": [{"label": "A", "text": "1, 2, 3."}, {"label": "B", "text": "2, 3, 4."}, {"label": "C", "text": "1, 3, 4."}, {"label": "D", "text": "1, 2, 4."}], "answer": "A", "explain": ""}, {"id": 142, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 14. Có bao nhiêu biện pháp góp phần giảm hiệu ứng nhà kính?\n(1) Trồng rừng, phủ xanh.  (2) Xử lí nghiêm hành vi phá rừng.\n(3) Làn sóng xanh quanh nhà để điều hòa vi khí hậu gia đình.\n(4) Tuyên truyền, giáo dục ý thức bảo vệ rừng.", "choices": [{"label": "A", "text": "1."}, {"label": "B", "text": "2."}, {"label": "C", "text": "3."}, {"label": "D", "text": "4."}], "answer": "C", "explain": "Ba ý (1), (2), (4) làm giảm CO2 toàn cầu. Ý (3) chủ yếu tạo vi khí hậu tại chỗ."}, {"id": 143, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 15. Trong quang hợp, pha sáng là pha:", "choices": [{"label": "A", "text": "Khử CO2 để hình thành carbohydrate từ ATP và NADPH."}, {"label": "B", "text": "Chuyển hóa quang năng được diệp lục hấp thụ thành hóa năng trong ATP và NADPH."}, {"label": "C", "text": "Chuyển hóa năng trong ATP và NADPH thành quang năng."}, {"label": "D", "text": "Chuyển hóa năng trong CO2 và H2O thành hóa năng trong ATP và NADPH."}], "answer": "B", "explain": ""}, {"id": 144, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 16. Pha sáng diễn ra tại:", "choices": [{"label": "A", "text": "Màng ngoài lục lạp."}, {"label": "B", "text": "Chất nền lục lạp."}, {"label": "C", "text": "Màng thylakoid."}, {"label": "D", "text": "Chất nền của bào quan khác."}], "answer": "C", "explain": ""}, {"id": 145, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 17. Nguyên liệu của pha sáng gồm:", "choices": [{"label": "A", "text": "ATP, NADPH, O2."}, {"label": "B", "text": "H2O, ADP, NADP+."}, {"label": "C", "text": "ATP, NADPH, CO2."}, {"label": "D", "text": "Carbohydrate, O2."}], "answer": "B", "explain": ""}, {"id": 146, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 18. Oxygen (O2) thoát ra trong quang hợp có nguồn gốc từ:", "choices": [{"label": "A", "text": "H2O."}, {"label": "B", "text": "ATP."}, {"label": "C", "text": "CO2."}, {"label": "D", "text": "NADPH."}], "answer": "A", "explain": ""}, {"id": 147, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 19. Sản phẩm của pha sáng trực tiếp tham gia vào pha tối là:", "choices": [{"label": "A", "text": "ATP."}, {"label": "B", "text": "ATP và NADPH."}, {"label": "C", "text": "NADPH."}, {"label": "D", "text": "O2."}], "answer": "B", "explain": ""}, {"id": 148, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 20. Phát biểu đúng về pha sáng:\n(1) Chuyển năng lượng ánh sáng thành năng lượng trong ATP và NADPH.\n(2) Diễn ra ở chất nền lục lạp.\n(3) Cần ADP, NADP+ được hoàn trả từ pha tối.\n(4) Diễn ra giống nhau ở thực vật C3, C4 và CAM.", "choices": [{"label": "A", "text": "1, 2, 4."}, {"label": "B", "text": "1, 3, 4."}, {"label": "C", "text": "2, 3, 4."}, {"label": "D", "text": "1, 2, 3."}], "answer": "B", "explain": ""}, {"id": 149, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 21. Pha tối là pha:", "choices": [{"label": "A", "text": "Đồng hóa CO2 thành carbohydrate nhờ năng lượng trong ATP và NADPH."}, {"label": "B", "text": "Chuyển hóa quang năng thành hóa năng trong ATP và NADPH."}, {"label": "C", "text": "Khử H2O để hình thành carbohydrate từ ATP và NADPH."}, {"label": "D", "text": "Chuyển hóa năng trong CO2 thành hóa năng trong ATP."}], "answer": "A", "explain": ""}, {"id": 150, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 22. Pha tối diễn ra tại:", "choices": [{"label": "A", "text": "Màng ngoài lục lạp."}, {"label": "B", "text": "Chất nền (stroma) của lục lạp."}, {"label": "C", "text": "Ribosome của lục lạp."}, {"label": "D", "text": "Màng thylakoid."}], "answer": "B", "explain": ""}, {"id": 151, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 23. Nguyên liệu của pha tối gồm:", "choices": [{"label": "A", "text": "ATP, NADPH, O2."}, {"label": "B", "text": "CO2, ATP, NADPH."}, {"label": "C", "text": "H2O, ADP, NADP+."}, {"label": "D", "text": "Carbohydrate, O2."}], "answer": "B", "explain": ""}, {"id": 152, "type": "short", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 24. Sản phẩm của pha tối gồm:", "answer": "Carbohydrate (đường), ADP, NADP+ và Pi. O2 không phải sản phẩm của pha tối.", "explain": ""}, {"id": 153, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 25. Chu trình cố định CO2 ở pha tối do ai phát hiện?", "choices": [{"label": "A", "text": "Calvin."}, {"label": "B", "text": "Krebs."}, {"label": "C", "text": "Menden."}, {"label": "D", "text": "Morgan."}], "answer": "A", "explain": ""}, {"id": 154, "type": "short", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 26. Ống nghiệm nào chứa nhiều CO2 hòa tan nhất sau 1 giờ chiếu sáng?", "answer": "Ống chỉ có ốc sên (hô hấp thải CO2) mà không có cây sẽ chứa nhiều CO2 nhất. Ống có cây C4 tiêu thụ CO2 mạnh hơn cây C3. Trên hình, chọn ống H2O + ốc sên (thường là ống A).", "explain": ""}, {"id": 155, "type": "short", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 27. Đánh dấu các nhóm thực vật C3, C4, CAM:", "answer": "1. Khí hậu ôn hòa: C3. 2. Sa mạc, hoang mạc: CAM. 3. Mía, ngô, kê, rau dền: C4. 4. Xương rồng, thanh long, dứa: CAM. 5. Khí hậu khô, nóng: C4 (CAM cũng chịu khô). 6. Phân bố khắp nơi, chủ yếu ôn đới và cận nhiệt đới: C3. 7. Khô hạn kéo dài: CAM. 8. Lúa, khoai, sắn, đậu: C3. 9. Chủ yếu nhiệt đới, cận nhiệt đới: C4.", "explain": ""}, {"id": 156, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 28. Mía, ngô và lúa. Phát biểu đúng:\n1. Mía là C3, ngô và lúa là C4.\n2. Ánh sáng mạnh, lúa bị giảm năng suất nhiều nhất.\n3. Mía và ngô có 2 loại tế bào tham gia cố định CO2 ở pha tối.\n4. Cả ba đều quang hợp tốt khi nồng độ CO2 giảm thấp.", "choices": [{"label": "A", "text": "1, 4."}, {"label": "B", "text": "2, 3."}, {"label": "C", "text": "1, 3."}, {"label": "D", "text": "2, 4."}], "answer": "B", "explain": "Mía và ngô là C4, lúa là C3. Ý 1 và ý 4 sai."}, {"id": 157, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 29. Nhóm thực vật CAM là:", "choices": [{"label": "A", "text": "Dứa, ngô, mía, thanh long."}, {"label": "B", "text": "Ngô, mía, cỏ lồng vực."}, {"label": "C", "text": "Dứa, xương rồng, thuốc bỏng."}, {"label": "D", "text": "Lúa, khoai, sắn, đậu."}], "answer": "C", "explain": ""}, {"id": 158, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 30. Quang hợp xảy ra mạnh ở miền ánh sáng nào?", "choices": [{"label": "A", "text": "Cam và đỏ."}, {"label": "B", "text": "Xanh tím, cam."}, {"label": "C", "text": "Đỏ, lục."}, {"label": "D", "text": "Xanh tím và đỏ."}], "answer": "D", "explain": ""}, {"id": 159, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 31. Ánh sáng đỏ kích thích tổng hợp:", "choices": [{"label": "A", "text": "Carbohydrate."}, {"label": "B", "text": "Hormone."}, {"label": "C", "text": "Lipid."}, {"label": "D", "text": "DNA."}], "answer": "A", "explain": ""}, {"id": 160, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 32. Ánh sáng xanh tím kích thích tổng hợp:", "choices": [{"label": "A", "text": "Carbohydrate."}, {"label": "B", "text": "Protein."}, {"label": "C", "text": "Lipid."}, {"label": "D", "text": "DNA."}], "answer": "B", "explain": ""}, {"id": 161, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 33. Đồ thị cường độ ánh sáng và cường độ quang hợp:\n1. Io là điểm bù ánh sáng.\n2. Im là điểm bão hòa ánh sáng.\n3. Qua Im, nhóm cây C3 dễ giảm hiệu suất hơn nếu ánh sáng quá mạnh kèm điều kiện bất lợi.\n4. Tại Io, cường độ quang hợp cao nhất.", "choices": [{"label": "A", "text": "1, 2, 4."}, {"label": "B", "text": "1, 3, 4."}, {"label": "C", "text": "2, 3, 4."}, {"label": "D", "text": "1, 2, 3."}], "answer": "D", "explain": "Ý 4 sai: tại Io quang hợp bằng hô hấp; cường độ quang hợp cao khi tới vùng bão hòa Im."}, {"id": 162, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 34. Nồng độ CO2 trong không khí thích hợp với quang hợp của cây là khoảng:", "choices": [{"label": "A", "text": "0,0008–0,01%."}, {"label": "B", "text": "0,2%."}, {"label": "C", "text": "0,04%."}, {"label": "D", "text": "Khoảng 0,03%."}], "answer": "D", "explain": ""}, {"id": 163, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 35. Nồng độ CO2 tối thiểu để cây quang hợp (điểm bù CO2) khoảng:", "choices": [{"label": "A", "text": "0,008–0,01% (0,0008–0,01% tùy cách ghi trên đề)."}, {"label": "B", "text": "0,2%."}, {"label": "C", "text": "0,04%."}, {"label": "D", "text": "0,03%."}], "answer": "A", "explain": ""}, {"id": 164, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 36. Cây C3 và C4 cùng một chuông kín, không cấp thêm CO2. Nồng độ CO2 sẽ:", "choices": [{"label": "A", "text": "Không thay đổi."}, {"label": "B", "text": "Giảm đến điểm bù CO2 của cây C3 rồi dừng."}, {"label": "C", "text": "Giảm đến điểm bù CO2 của cây C4 (thấp hơn C3) rồi ổn định."}, {"label": "D", "text": "Tăng dần rồi ổn định."}], "answer": "C", "explain": ""}, {"id": 165, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 37. Quang hợp quyết định khoảng bao nhiêu phần trăm năng suất cây trồng?", "choices": [{"label": "A", "text": "80–85%."}, {"label": "B", "text": "85–90%."}, {"label": "C", "text": "90–95%."}, {"label": "D", "text": "Trên 95%."}], "answer": "C", "explain": ""}, {"id": 166, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 38. Có bao nhiêu biện pháp làm tăng năng suất nhờ quang hợp?\n1. Kĩ thuật nông học và công nghệ cao.  2. Bón phân, tưới nước hợp lí, đúng thời vụ.\n3. Chọn và tạo giống năng suất cao.  4. Nhà kính, đèn LED phù hợp.", "choices": [{"label": "A", "text": "1."}, {"label": "B", "text": "2."}, {"label": "C", "text": "3."}, {"label": "D", "text": "4."}], "answer": "D", "explain": ""}, {"id": 167, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 39. Có bao nhiêu ưu điểm của trồng cây trong nhà kính dùng đèn LED (Đà Lạt)?\n1. Khắc phục thời tiết bất lợi.  2. Hạn chế sâu bệnh.\n3. Chỉnh được cường độ và thành phần ánh sáng.  4. Trồng nhiều tầng, tiết kiệm diện tích.", "choices": [{"label": "A", "text": "1."}, {"label": "B", "text": "2."}, {"label": "C", "text": "3."}, {"label": "D", "text": "4."}], "answer": "D", "explain": ""}, {"id": 168, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 40. Có bao nhiêu phát biểu đúng về tăng năng suất cây trồng nhờ KHKT?\n1. Tăng cường độ và hiệu suất quang hợp bằng KHKT.\n2. Tăng diện tích lá bằng tưới nước, bón phân hợp lí.\n3. Chọn giống để nâng hiệu quả quang hợp.\n4. Công nghệ cao, bố trí mùa vụ hợp lí.", "choices": [{"label": "A", "text": "1."}, {"label": "B", "text": "2."}, {"label": "C", "text": "3."}, {"label": "D", "text": "4."}], "answer": "D", "explain": ""}, {"id": 169, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 41. Rau dền lá đỏ vẫn quang hợp bình thường. Phát biểu đúng:\n1. Carotenoid chiếm ưu thế về màu.  2. Lá vẫn chứa diệp lục.\n3. Cường độ quang hợp có thể thấp hơn lá xanh.  4. Không có diệp lục, carotenoid thay diệp lục.", "choices": [{"label": "A", "text": "1, 2, 4."}, {"label": "B", "text": "2, 3, 4."}, {"label": "C", "text": "1, 2, 3."}, {"label": "D", "text": "1, 3, 4."}], "answer": "C", "explain": ""}, {"id": 170, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 42. Vì sao nhiều cây CAM sinh trưởng chậm hơn cây C3, C4?\n1. Sống nơi khô hạn, nắng gắt.  2. Cố định CO2 hai lần nên tốn nhiều ATP hơn.\n3. Thân lá thường nhỏ, dự trữ nước.  4. Chỉ tổng hợp chất hữu cơ ban ngày nên chậm hơn C3.", "choices": [{"label": "A", "text": "1, 2, 4."}, {"label": "B", "text": "2, 3, 4."}, {"label": "C", "text": "1, 2, 3."}, {"label": "D", "text": "1, 3, 4."}], "answer": "C", "explain": "Hai nguyên nhân chính là môi trường khắc nghiệt và tốn thêm ATP. Ý 4 không phải nguyên nhân đúng."}, {"id": 171, "type": "mcq", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 43. Trồng lúa quá dày gây hiện tượng nào?\n1. Cạnh tranh nước và dinh dưỡng.  2. Dễ lây sâu bệnh vì ẩm, kém thoáng.\n3. Khí kém lưu thông, hơi nước khó thoát.  4. Cạnh tranh ánh sáng, quang hợp giảm, cây không đều.", "choices": [{"label": "A", "text": "1."}, {"label": "B", "text": "2."}, {"label": "C", "text": "3."}, {"label": "D", "text": "4."}], "answer": "D", "explain": ""}, {"id": 172, "type": "short", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 1. TRẮC NGHIỆM NHIỀU LỰA CHỌN", "prompt": "Câu 44. Vì sao trồng xen cây ưa bóng (điểm bù ánh sáng thấp) với cây ưa sáng (điểm bù cao)?\n1. Cây ưa bóng có cường độ quang hợp cao hơn cây ưa sáng.\n2. Để chúng chia sẻ dinh dưỡng cho nhau.\n3. Cây ưa bóng có điểm bù ánh sáng thấp, cây ưa sáng có điểm bù cao.\n4. Để tận dụng ánh sáng, nước, dinh dưỡng.", "answer": "Ý 4 là mục đích. Ý 3 giải thích được vì sao trồng xen được. Ý 1 và ý 2 sai. Chọn các ý 3 và 4.", "explain": ""}, {"id": 173, "type": "tf", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 2. TRẮC NGHIỆM ĐÚNG / SAI", "prompt": "Câu 1. Quang hợp ở thực vật C3, C4 và CAM:", "statement": "a. Ở cây C3, pha tối chỉ diễn ra ở nơi có ánh sáng.", "answer": "S", "explain": "pha tối ở stroma, không cần ánh sáng trực tiếp"}, {"id": 174, "type": "tf", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 2. TRẮC NGHIỆM ĐÚNG / SAI", "prompt": "Câu 1. Quang hợp ở thực vật C3, C4 và CAM:", "statement": "b. Cây C4 và CAM có thêm giai đoạn cố định sơ bộ CO2 ở tế bào mô giậu.", "answer": "Đ", "explain": ""}, {"id": 175, "type": "tf", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 2. TRẮC NGHIỆM ĐÚNG / SAI", "prompt": "Câu 1. Quang hợp ở thực vật C3, C4 và CAM:", "statement": "c. Cây CAM đóng khí khổng ban ngày, mở ban đêm để tránh mất nước.", "answer": "Đ", "explain": ""}, {"id": 176, "type": "tf", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 2. TRẮC NGHIỆM ĐÚNG / SAI", "prompt": "Câu 1. Quang hợp ở thực vật C3, C4 và CAM:", "statement": "d. Cây C3 dùng PEP-carboxylase để lấy CO2 ở nồng độ rất thấp.", "answer": "S", "explain": "đó là C4 và CAM; C3 dùng Rubisco"}, {"id": 177, "type": "tf", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 2. TRẮC NGHIỆM ĐÚNG / SAI", "prompt": "Câu 2. Pha tối của quang hợp:", "statement": "a. Pha tối diễn ra ở màng thylakoid.", "answer": "S", "explain": "ở stroma"}, {"id": 178, "type": "tf", "section": "BÀI 3. QUANG HỢP Ở THỰC VẬT", "part": "PHẦN 2. TRẮC NGHIỆM const state = { pool: DATA, index: 0, picks: {}, revealed: {}, filter: "Tất cả" };

const home = document.getElementById("home");
const quiz = document.getElementById("quiz");
const result = document.getElementById("result");
const homeBtn = document.getElementById("homeBtn");

function baiName(section) {
  return (section || "").split(".")[0];
}
function sections() {
  const seen = [];
  DATA.forEach(q => { if (!seen.includes(q.section)) seen.push(q.section); });
  return seen;
}
function filtered() {
  if (state.filter === "Tất cả") return DATA;
  return DATA.filter(q => q.section === state.filter);
}
function renderHome() {
  const box = document.getElementById("picks");
  const all = [{ name: "Làm tất cả", section: "Tất cả", count: DATA.length }];
  sections().forEach(s => all.push({ name: s, section: s, count: DATA.filter(q => q.section === s).length }));
  box.innerHTML = all.map(x => `<button class="pick" data-section="${x.section.replaceAll('"', "&quot;")}"><b>${x.name}</b><small>${x.count} câu</small></button>`).join("");
  box.querySelectorAll("button").forEach(btn => btn.onclick = () => start(btn.dataset.section));
}
function start(section) {
  state.filter = section;
  state.pool = filtered();
  state.index = 0;
  state.picks = {};
  state.revealed = {};
  home.classList.add("hide");
  result.classList.add("hide");
  quiz.classList.remove("hide");
  homeBtn.classList.remove("hide");
  renderFilters();
  render();
}
function renderFilters() {
  const names = ["Tất cả", ...sections()];
  document.getElementById("filters").innerHTML = names.map(n => {
    const label = n === "Tất cả" ? "Tất cả" : baiName(n);
    return `<button class="chip ${n === state.filter ? "active" : ""}" data-f="${n.replaceAll('"', "&quot;")}">${label}</button>`;
  }).join("");
  document.querySelectorAll("#filters .chip").forEach(chip => chip.onclick = () => {
    state.filter = chip.dataset.f;
    state.pool = filtered();
    state.index = 0;
    renderFilters();
    render();
  });
}
function keyOf(q) { return String(q.id); }
function render() {
  const list = state.pool;
  if (!list.length) return;
  if (state.index >= list.length) state.index = list.length - 1;
  const q = list[state.index];
  const k = keyOf(q);
  document.getElementById("pos").textContent = `Câu ${state.index + 1} / ${list.length}`;
  document.getElementById("bar").style.width = `${((state.index + 1) / list.length) * 100}%`;
  document.getElementById("tag").textContent = `${baiName(q.section)} · ${q.part || ""}`;
  document.getElementById("prompt").textContent = q.prompt;
  const st = document.getElementById("statement");
  const box = document.getElementById("options");
  const exp = document.getElementById("explain");
  const revealed = !!state.revealed[k];
  st.classList.add("hide");
  exp.classList.add("hide");
  box.innerHTML = "";
  if (q.type === "tf") {
    st.classList.remove("hide");
    st.textContent = q.statement;
    ["Đ", "S"].forEach(label => {
      const b = document.createElement("button");
      b.className = "tfbtn";
      b.textContent = label === "Đ" ? "Đúng" : "Sai";
      if (state.picks[k] === label) b.classList.add("selected");
      if (revealed && label === q.answer) b.classList.add("good");
      if (revealed && state.picks[k] === label && label !== q.answer) b.classList.add("bad");
      b.onclick = () => { if (!revealed) { state.picks[k] = label; render(); } };
      box.appendChild(b);
    });
  } else if (q.type === "mcq") {
    q.choices.forEach(c => {
      const b = document.createElement("button");
      b.className = "opt";
      b.textContent = `${c.label}. ${c.text}`;
      if (state.picks[k] === c.label) b.classList.add("selected");
      if (revealed && c.label === q.answer) b.classList.add("good");
      if (revealed && state.picks[k] === c.label && c.label !== q.answer) b.classList.add("bad");
      b.onclick = () => { if (!revealed) { state.picks[k] = c.label; render(); } };
      box.appendChild(b);
    });
  } else {
    const b = document.createElement("button");
    b.className = "primary";
    b.textContent = revealed ? "Đã hiện đáp án" : "Hiện đáp án";
    b.disabled = revealed;
    b.onclick = () => { state.revealed[k] = true; state.picks[k] = "seen"; render(); };
    box.appendChild(b);
  }
  if (revealed) {
    exp.classList.remove("hide");
    const ans = q.type === "tf" ? (q.answer === "Đ" ? "Đúng" : "Sai") : (q.type === "mcq" ? q.answer : q.answer);
    exp.innerHTML = `<b>Đáp án:</b> ${ans}${q.explain ? `<br>${q.explain}` : ""}`;
  }
  const graded = list.filter(item => item.type !== "short");
  const done = graded.filter(item => state.revealed[keyOf(item)]).length;
  const right = graded.filter(item => state.revealed[keyOf(item)] && state.picks[keyOf(item)] === item.answer).length;
  document.getElementById("live").textContent = done ? `Đúng ${right}/${done} câu đã chấm` : "";
  document.getElementById("prev").disabled = state.index === 0;
  document.getElementById("next").disabled = state.index === list.length - 1;
  document.getElementById("check").textContent = q.type === "short" ? "Hiện đáp án" : "Kiểm tra";
  document.getElementById("check").disabled = revealed || (q.type !== "short" && !state.picks[k]);
  const map = document.getElementById("map");
  map.innerHTML = "";
  list.forEach((item, i) => {
    const d = document.createElement("button");
    d.className = "dot";
    d.textContent = i + 1;
    if (i === state.index) d.classList.add("now");
    const kk = keyOf(item);
    if (state.revealed[kk]) {
      if (item.type === "short" || state.picks[kk] === item.answer) d.classList.add("ok");
      else d.classList.add("no");
    }
    d.onclick = () => { state.index = i; render(); };
    map.appendChild(d);
  });
}
document.getElementById("prev").onclick = () => { if (state.index > 0) { state.index--; render(); } };
document.getElementById("next").onclick = () => { if (state.index < state.pool.length - 1) { state.index++; render(); } };
document.getElementById("check").onclick = () => {
  const q = state.pool[state.index];
  state.revealed[keyOf(q)] = true;
  if (q.type === "short") state.picks[keyOf(q)] = "seen";
  render();
};
function scoreOf(list) {
  const graded = list.filter(q => q.type !== "short");
  const right = graded.filter(q => state.picks[keyOf(q)] === q.answer).length;
  return { right, total: graded.length };
}
document.getElementById("finish").onclick = () => {
  const list = state.pool;
  list.forEach(q => {
    if (q.type !== "short" && state.picks[keyOf(q)]) state.revealed[keyOf(q)] = true;
  });
  const s = scoreOf(list);
  const answered = list.filter(q => q.type !== "short" && state.picks[keyOf(q)]);
  const wrong = answered.filter(q => state.picks[keyOf(q)] !== q.answer);
  const skipped = list.filter(q => q.type !== "short" && !state.picks[keyOf(q)]).length;
  quiz.classList.add("hide");
  result.classList.remove("hide");
  const pct = s.total ? Math.round(s.right / s.total * 100) : 0;
  document.getElementById("score").textContent = `${s.right}/${s.total}`;
  document.getElementById("scoreText").textContent = `Đúng ${s.right} câu, sai ${wrong.length} câu, chưa làm ${skipped} câu. Tỷ lệ trên toàn bộ câu chấm được là ${pct}%. Câu trả lời ngắn không tính điểm.`;
  const baiBox = document.getElementById("byBai");
  baiBox.innerHTML = sections().filter(sec => list.some(q => q.section === sec)).map(sec => {
    const part = scoreOf(list.filter(q => q.section === sec));
    return `<p><b>${baiName(sec)}:</b> ${part.right}/${part.total}</p>`;
  }).join("");
  const misses = wrong;
  document.getElementById("misses").innerHTML = misses.length ? misses.map(q => {
    const yours = state.picks[keyOf(q)] || "bỏ trống";
    const ans = q.type === "tf" ? (q.answer === "Đ" ? "Đúng" : "Sai") : q.answer;
    const extra = q.statement ? `<br><i>${q.statement}</i>` : "";
    return `<div class="miss"><b>${q.prompt}</b>${extra}<br>Bạn chọn: ${yours} · Đáp án: <span style="background:var(--yellow)">${ans}</span></div>`;
  }).join("") : "<p>Không có câu sai.</p>";
};
document.getElementById("review").onclick = () => { result.classList.add("hide"); quiz.classList.remove("hide"); render(); };
document.getElementById("again").onclick = () => start(state.filter);
homeBtn.onclick = () => { quiz.classList.add("hide"); result.classList.add("hide"); home.classList.remove("hide"); homeBtn.classList.add("hide"); };
document.addEventListener("keydown", e => {
  if (quiz.classList.contains("hide")) return;
  const q = state.pool[state.index];
  if (!q || state.revealed[keyOf(q)]) {
    if (e.key === "ArrowRight") document.getElementById("next").click();
    if (e.key === "ArrowLeft") document.getElementById("prev").click();
    return;
  }
  const map = { a: "A", b: "B", c: "C", d: "D", "1": "A", "2": "B", "3": "C", "4": "D" };
  if (q.type === "mcq" && map[e.key.toLowerCase()]) { state.picks[keyOf(q)] = map[e.key.toLowerCase()]; render(); }
  if (q.type === "tf" && (e.key.toLowerCase() === "d" || e.key === "1")) { state.picks[keyOf(q)] = "Đ"; render(); }
  if (q.type === "tf" && (e.key.toLowerCase() === "s" || e.key === "2")) { state.picks[keyOf(q)] = "S"; render(); }
  if (e.key === "Enter") document.getElementById("check").click();
});
renderHome();
</script>
</body>
